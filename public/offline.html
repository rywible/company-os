<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Company OS · Offline</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #ffffff;
        color: #171717;
        font:
          16px -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        padding: 32px;
      }
      main {
        max-width: 350px;
      }
      img {
        width: 60px;
        height: 60px;
        border-radius: 16px;
        margin-bottom: 32px;
      }
      small {
        font-size: 11px;
        letter-spacing: 2px;
        color: #666666;
        display: block;
        margin-bottom: 18px;
      }
      h1 {
        font-size: 28px;
        line-height: 1.1;
        letter-spacing: -0.7px;
        font-weight: 500;
        margin: 0 0 22px;
      }
      p {
        line-height: 1.7;
        color: #666666;
      }
      button {
        font: inherit;
        background: #171717;
        color: white;
        border: 0;
        border-radius: 6px;
        padding: 14px 22px;
        min-height: 48px;
        margin-top: 12px;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid #171717;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Company OS" /><small
        >COMPANY OS</small
      >
      <h1>Offline</h1>
      <p>Reconnect to load your workspace.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
    <script>
      let checking = false;
      async function reconnect() {
        if (!navigator.onLine || checking) return;
        checking = true;
        try {
          const response = await fetch("/healthz", {
            cache: "no-store",
            signal: AbortSignal.timeout(5000),
          });
          if (response.ok) {
            location.reload();
            return;
          }
        } catch {}
        checking = false;
        if (navigator.onLine) setTimeout(reconnect, 1500);
      }
      addEventListener("online", reconnect);
      if (navigator.onLine) reconnect();
    </script>
  </body>
</html>
