name: CI
on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Bun omits this SDK's bundled file dependency on fresh installs.
      # Keep this aligned with the runtime-image setup in Dockerfile.
      - name: Prepare bundled Fly SDK dependency
        run: |
          mkdir -p node_modules/@fly/sprites/node_modules/@fly/client-signals
          cp -R node_modules/@fly/sprites/vendor/client-signals/. node_modules/@fly/sprites/node_modules/@fly/client-signals/
          bun -e 'await import("@fly/sprites")'
      - name: Type checks, backend tests, build and browser acceptance
        run: xvfb-run -a bun scripts/ci.ts
