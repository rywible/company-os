app = "company-os-rywible"
primary_region = "ord"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATABASE_PATH = "/data/company.sqlite"
  PUBLIC_ORIGIN = "https://company-os-rywible.fly.dev"
  SPRITE_NAME = "company-os-worker"
  GITHUB_REPOSITORY = "rywible/company-os"
  EMBEDDING_MODEL = "gemini-embedding-001"

[[mounts]]
  source = "company_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
